<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude-style Chat</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Sidebar (Claude desktop style) ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn" title="Toggle sidebar" onclick="toggleSidebar()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="2" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="6" y1="2" x2="6" y2="14" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <button class="icon-btn" title="New chat" onclick="newChat()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-section">
        <a class="side-item active" href="#">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M3 12c2.5-2.5 5.5-2.5 8 0M4 7a4 4 0 1 1 8 0 4 4 0 0 1-8 0z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Chats
        </a>
        <a class="side-item" href="#">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 5v3l2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Projects
        </a>
        <a class="side-item" href="#">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M4 3h8M4 6.5h8M4 10h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Artifacts
        </a>
      </div>

      <div class="sidebar-scroll">
        <div class="history-label">Recents</div>
        <div id="history"></div>
      </div>

      <div class="sidebar-bottom">
        <button class="upgrade-card">
          <div class="upgrade-title"></div>
          <div class="upgrade-sub">Start planning to get<br/>higher usage limits</div>
        </button>
        <div class="user-row">
          <div class="avatar">U</div>
          <span class="user-name">username</span>
          <span class="plan-badge">Free</span>
        </div>
      </div>
    </aside>

    <!-- ===== Main area ===== -->
    <main class="main">
      <header class="topbar">
        <select class="model-select" id="modelSelect">
          <option value="claude-sonnet-4-5">Sonnet 4.5</option>
          <option value="claude-opus-4-1">Opus 4.1</option>
          <option value="claude-haiku-4-5">Haiku 4.5</option>
        </select>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <!-- Empty state / greeting, Claude style -->
        <div class="empty-state" id="emptyState">
          <div class="sunburst">✳</div>
          <h1 class="greeting" id="greeting">Good afternoon, how can I help you today?</h1>
          <div class="suggestions">
            <button class="chip" onclick="usePrompt(this)">Write a function to…</button>
            <button class="chip" onclick="usePrompt(this)">Explain this concept…</button>
            <button class="chip" onclick="usePrompt(this)">Help me brainstorm ideas for…</button>
            <button class="chip" onclick="usePrompt(this)">Summarize this article…</button>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </div>

      <!-- Composer -->
      <div class="composer-wrap">
        <form class="composer" id="composerForm" onsubmit="return false;">
          <textarea id="input" rows="1" placeholder="How can I help you today?" autofocus></textarea>
          <div class="composer-row">
            <div class="composer-left">
              <button type="button" class="icon-btn" title="Attach files">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </button>
              <button type="button" class="pill-btn">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                  <path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
                Style
              </button>
              <button type="button" class="pill-btn">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                  <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.2"/>
                </svg>
                Search
              </button>
            </div>
            <button type="submit" class="send-btn" id="sendBtn" title="Send">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 13V3M4 6.5L8 2.5l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </form>
        <div class="fineprint">Claude is a AI assistant. Responses stream from a FastAPI backend.</div>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
